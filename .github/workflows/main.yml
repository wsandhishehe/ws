name: morning

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00；修改 cron 表达式以恢复停用的定时任务。
    - cron: '0 0 * * 0-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只预览，不发送微信消息（实际发送请取消勾选）'
        type: boolean
        default: true
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: morning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  send_message:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: validate or send greeting
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Send or preview greeting
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          USER_ID: ${{ secrets.USER_ID }}
          START_DATE: ${{ secrets.START_DATE }}
          # One-time long-distance relationship countdown; optional repository variable override.
          BIRTHDAY: ${{ vars.END_DATE || '2028-05-20' }}
          CITY: ${{ secrets.CITY }}
          CITY_COORDINATES: ${{ secrets.CITY_COORDINATES }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python main.py --check
          elif [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi
